name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Exo.WebApi.sln

      - name: Build
        run: dotnet build Exo.WebApi.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Exo.WebApi.sln --configuration Release --no-build --logger "console;verbosity=normal" --collect:"XPlat Code Coverage"

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --tag exo-webapi:ci .
